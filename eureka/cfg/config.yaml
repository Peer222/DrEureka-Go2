defaults:
  - _self_
  - env: forward_locomotion_go2
  - override hydra/launcher: local
  - override hydra/output: local

hydra:
  job:
    chdir: True

# LLM parameters
model_path: /bigwork/nhwpduep/master_thesis/models/
model: cmd_line_argument  # original: gpt-4-0125-preview
thinking_enabled: True  # for Qwen3 models with thinking
include_thinking_in_prompt: True

# Eureka parameters
iteration: 5                # how many iterations of Eureka to run
sample: 16                  # number of Eureka samples to generate per iteration
feedback_series_size: 10    # Number of values included in feedback prompt per metric

# GPU setup
num_gpus: 1                # for more GPUs fix setFreestGPU() call (gpu_stat file not found)
processes_per_gpu: 2       # 3 execution failed in dry run and code stuck (original code probably had enough gpus to run all samples per iteration in parallel)

# Weights and Biases
use_wandb: True            # whether to use wandb for logging
use_run_wandb: False       # whether to use wandb for logging of individual evaluation runs
wandb_username: "peer222-luh"  # wandb username if logging with wandb
wandb_project: "peer222-luh/master-thesis"  # wandb project if logging with wandb

# resume eureka run from intermediate result
resume: False
stats_file: cmd_line_argument